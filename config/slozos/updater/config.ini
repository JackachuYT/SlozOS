[General]
# SlozOS release notes, shown on the updater's Announcements page
rssFeedType=atom
rssFeed=https://github.com/JackachuYT/SlozOS/releases.atom

[Commands]
allowEarlyExit=true
systemUpdateCommand=/usr/libexec/uupd-update
systemRollbackCommand=slozos-update rollback

[Rebase]
# Its rebase page lists Bazzite images; SlozOS channels are `slozos-update channel`
enabled=false
