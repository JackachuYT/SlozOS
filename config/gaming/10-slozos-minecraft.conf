<?xml version="1.0" standalone="yes"?>
<!-- Threaded OpenGL for Minecraft (Java) run outside Flatpak; the Flatpak
     launchers get the same via /var/lib/flatpak/overrides. -->
<driconf>
  <device>
    <application name="Minecraft (Java)" executable="java">
      <option name="mesa_glthread" value="true"/>
    </application>
  </device>
</driconf>
