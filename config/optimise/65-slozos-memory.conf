# SlozOS memory tuning, most noticeable on 4–8 GB PCs (the same values Bazzite uses on
# the Steam Deck, which Bazzite's desktop images don't ship).
#
# Swap is zram (compressed RAM), which is far cheaper to use than evicting the
# page cache, so prefer it strongly...
vm.swappiness=180
# ...and read one page at a time from it (no readahead: zram has no seek cost)
vm.page-cluster=0
# Don't let the kernel briefly over-reclaim after fragmentation events, and
# start background reclaim a little earlier so apps rarely stall on memory
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
# Write dirty pages out in small steady chunks instead of big bursts that
# freeze the desktop on slow SSDs
vm.dirty_bytes=268435456
vm.dirty_background_bytes=134217728
