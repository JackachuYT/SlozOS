# SlozOS: compressed swap in RAM. Bazzite's desktop default is half of RAM; on
# a 4 GB Surface Pro that's only 2 GB. zstd typically compresses 3:1, so a
# zram device the size of RAM (capped at 8 GB) lets 4 GB machines hold far
# more before anything gets killed.
[zram0]
compression-algorithm=zstd
zram-size = min(ram, 8192)
