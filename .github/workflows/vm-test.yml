name: VM test (QEMU)

# Boots each edition in a QEMU/KVM virtual machine, logs in, and saves
# screenshots of the boot splash, login screen and desktop as an artifact.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Which edition to test
        type: choice
        options: [all, sp2, sp1, sb1]
        default: all
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  vm-test:
    name: VM test ${{ matrix.device }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.edition != 'all') && format('["{0}"]', inputs.edition) || '["sp2","sp1","sb1"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Enable KVM + install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          ls -l /dev/kvm

      - name: Build SlozOS ${{ matrix.device }} image
        run: |
          sudo podman build -t localhost/slozos-${{ matrix.device }}:latest \
            -f build/Containerfile.${{ matrix.device }} .

      - name: Make VM disk image
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/tests/vm/bib-config.toml:/config.toml:ro" \
            -v "$(pwd)/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs btrfs --config /config.toml \
            localhost/slozos-${{ matrix.device }}:latest
          sudo chown -R "$USER:$USER" output
          ls -lh output/qcow2/

      - name: Boot in QEMU, log in, take screenshots
        run: python3 tests/vm/qemu-test.py --disk output/qcow2/disk.qcow2 --out vm-results

      - name: Upload screenshots + serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-${{ matrix.device }}
          path: vm-results/
          retention-days: 14
