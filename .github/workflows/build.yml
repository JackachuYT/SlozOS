name: Build SlozOS

# One build per edition per change:
#   • Pull request → build the image once, make the ISO *and* a VM disk from it,
#     boot the VM, screenshot it, keep the ISO as an artifact. Never publishes.
#   • Merge to main → no rebuild: if the merged code is exactly what the PR
#     tested, publish the ISOs that PR run already built. Otherwise (main moved
#     on, direct push, artifact expired) build as usual and publish.
#   • Run workflow (manual) → full build + publish.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      # Test-only changes don't change the OS, so don't republish releases
      - 'tests/**'
      - '.github/workflows/interactive-vm.yml'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

# A new push to a PR cancels that PR's still-running build; main never cancels.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Stable check name — branch protection requires it.
    name: Build ${{ matrix.display_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write     # push the OS update images to ghcr.io
    strategy:
      fail-fast: false          # keep building the others if one fails
      matrix:
        include:
          - device: standard
            display_name: SlozOS
            bazzite: bazzite
            edition: Standard
            image_tag: slozos
            iso_name: SlozOS-1.4.1-amd64
            artifact: SlozOS-ISO
            release_tag: v1.4.1-standard
            release_title: "SlozOS 1.4.1"
            # old per-Surface update channels that keep receiving this edition
            legacy_images: "slozos-sp1 slozos-sp2"
            release_notes: |
              SlozOS 1.4.1 for PCs with **Intel or AMD graphics** — most desktops, laptops and AMD handhelds.

              **New in 1.4.1 — the macOS Tahoe look, refreshed.** The whole desktop moves to the MacTahoe theme: macOS 26/27-style app icons, Liquid Glass dock, window buttons and cursors. Control Center is redesigned to match, with glass pill tiles, wide volume and brightness sliders, power/lock/screenshot buttons and a Game Mode tile that opens Steam Big Picture. Hardware video decoding is now set up on more Intel GPUs, so video uses less CPU.

              SlozOS runs on almost any 64-bit PC, laptop or handheld, and adapts to your hardware at boot.

              **Surface owners:** Surface Pro 1 and Pro 2 use this edition (the Surface Book 1 uses SlozOS NVIDIA). Existing Surface installs move over automatically with their next update.

              **Also included:** Control Center, SlozOS Welcome, Spotlight (Meta+Space), the Apps grid, the macOS Tahoe Liquid Glass desktop, Minecraft-ready gaming tuning and SlozOS's own update channel.

              The ISO is split into 1900 MB parts. Download all parts into one folder, then reassemble:
              ```
              7z x SlozOS-1.4.1-amd64.7z.001
              ```
              Flash `SlozOS-1.4.1-amd64.iso` with Balena Etcher and boot from the USB stick.

          - device: nvidia
            display_name: SlozOS NVIDIA
            bazzite: bazzite-nvidia
            edition: NVIDIA
            image_tag: slozos-nvidia
            iso_name: SlozOS-1.4.1-NVIDIA-amd64
            artifact: SlozOS-NVIDIA-ISO
            release_tag: v1.4.1-nvidia
            release_title: "SlozOS 1.4.1 — NVIDIA"
            # old per-Surface update channels that keep receiving this edition
            legacy_images: "slozos-sb1"
            release_notes: |
              SlozOS 1.4.1 for PCs with an **NVIDIA graphics card**, including hybrid Intel + NVIDIA laptops.

              **New in 1.4.1 — the macOS Tahoe look, refreshed.** The whole desktop moves to the MacTahoe theme: macOS 26/27-style app icons, Liquid Glass dock, window buttons and cursors. Control Center is redesigned to match, with glass pill tiles, wide volume and brightness sliders, power/lock/screenshot buttons and a Game Mode tile that opens Steam Big Picture. Hardware video decoding is now set up on more Intel GPUs, so video uses less CPU.

              SlozOS runs on almost any 64-bit PC, laptop or handheld, and adapts to your hardware at boot.

              **Surface owners:** the Surface Book 1 uses this edition (Surface Pro 1/2 use the standard one). Existing Surface installs move over automatically with their next update.

              **Also included:** Control Center, SlozOS Welcome, Spotlight (Meta+Space), the Apps grid, the macOS Tahoe Liquid Glass desktop, Minecraft-ready gaming tuning and SlozOS's own update channel.

              The ISO is split into 1900 MB parts. Download all parts into one folder, then reassemble:
              ```
              7z x SlozOS-1.4.1-NVIDIA-amd64.7z.001
              ```
              Flash `SlozOS-1.4.1-NVIDIA-amd64.iso` with Balena Etcher and boot from the USB stick.

    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      SLOZOS_VERSION: "1.4.1"
      # Installed systems update from here (see config/slozos/slozos-update-origin)
      IMAGE: ghcr.io/jackachuyt/${{ matrix.image_tag }}
      # The commit this build is of: the PR head for PRs, the pushed commit otherwise
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reuse the ISO the pull request already built
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          PR_HEAD=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // empty')
          if [ -z "$PR_HEAD" ]; then echo "Not from a pull request — building."; exit 0; fi
          # Only reuse if the merged code is byte-for-byte what the PR tested
          OUR_TREE=$(git rev-parse 'HEAD^{tree}')
          PR_TREE=$(gh api "repos/$REPO/git/commits/$PR_HEAD" --jq .tree.sha)
          if [ "$OUR_TREE" != "$PR_TREE" ]; then echo "Merged code differs from what the PR tested — building."; exit 0; fi
          RUN=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$PR_HEAD&event=pull_request" \
                  --jq '[.workflow_runs[] | select(.status == "completed")][0].id // empty')
          if [ -z "$RUN" ]; then echo "No finished PR build found — building."; exit 0; fi
          mkdir -p output
          if gh run download "$RUN" -n "${{ matrix.artifact }}" -D output; then
            echo "Reusing ${{ matrix.artifact }} from PR build $RUN"
            ls -lh output
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "pr_head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "PR build $RUN has no ${{ matrix.artifact }} (failed or expired) — building."
            rm -rf output
          fi

      - name: Free up disk space
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      # The base layer (packages, themes, boot splash) is its own image, keyed on
      # the exact Bazzite digest + the base inputs. Unchanged → reuse it, so the
      # OS image keeps the same base layers and updates stay small.
      - name: Prepare SlozOS base image
        if: steps.reuse.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y skopeo; }
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          BAZZITE=ghcr.io/ublue-os/${{ matrix.bazzite }}:stable
          DIGEST=$(sudo skopeo inspect --format '{{.Digest}}' "docker://$BAZZITE")
          INPUTS=$(cat build/Containerfile.base build/slozos-base.sh build/ini-merge.py config/plymouth/slozos/* | sha256sum | cut -c1-12)
          BASE=ghcr.io/jackachuyt/slozos-base-${{ matrix.device }}:${DIGEST#sha256:}
          BASE=${BASE:0:$(( ${#BASE} - 64 + 12 ))}-$INPUTS
          if sudo skopeo inspect "docker://$BASE" >/dev/null 2>&1; then
            echo "Reusing base image $BASE"
          else
            echo "Building base image $BASE (Bazzite $DIGEST)"
            sudo podman build -f build/Containerfile.base \
              --build-arg BAZZITE="ghcr.io/ublue-os/${{ matrix.bazzite }}@$DIGEST" \
              -t "$BASE" .
            sudo podman push "$BASE"
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Build SlozOS ${{ matrix.display_name }} image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo podman build \
            --build-arg BASE="$BASE" \
            --build-arg EDITION="${{ matrix.edition }}" \
            --build-arg IMAGE="$IMAGE" \
            --build-arg VERSION="$SLOZOS_VERSION" \
            -t localhost/${{ matrix.image_tag }}:latest \
            -f build/Containerfile .

      - name: Push update image (tagged with this commit)
        if: steps.reuse.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push localhost/${{ matrix.image_tag }}:latest "docker://$IMAGE:sha-$HEAD_SHA"

      - name: Generate bootable ISO
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs btrfs \
            localhost/${{ matrix.image_tag }}:latest
          ISO=$(sudo find output -name '*.iso' | head -1)
          sudo mv "$ISO" output/${{ matrix.iso_name }}.iso
          sudo chown -R "$USER:$USER" output
          ls -lh output/

      - name: Upload ISO artifact
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: output/${{ matrix.iso_name }}.iso
          retention-days: 7
          compression-level: 0

      - name: Split ISO into <2GB volumes
        if: env.PUBLISH == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y p7zip-full
          cd output && 7z a -mx=0 -v1900m ${{ matrix.iso_name }}.7z ${{ matrix.iso_name }}.iso
          ls -lh ${{ matrix.iso_name }}.7z.*

      - name: Publish update image (stable + version tags)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_SHA: ${{ steps.reuse.outputs.pr_head || env.HEAD_SHA }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y skopeo; }
          echo "$GH_TOKEN" | sudo skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Same registry, same blobs: these are just new tags on the tested image
          for tag in stable "$SLOZOS_VERSION"; do
            sudo skopeo copy --all "docker://$IMAGE:sha-$SRC_SHA" "docker://$IMAGE:$tag"
          done
          # Old per-Surface channels get this edition too, so Surface installs
          # update to it and then move to $IMAGE (see slozos-update-origin)
          for legacy in ${{ matrix.legacy_images }}; do
            sudo skopeo copy --all "docker://$IMAGE:sha-$SRC_SHA" "docker://ghcr.io/jackachuyt/$legacy:stable"
          done

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through env, not inlined: inlining put the notes inside a
          # double-quoted shell string, so their ``` fences ran as command
          # substitutions (the published notes contained 7-Zip's console output).
          RELEASE_TITLE: ${{ matrix.release_title }}
          RELEASE_NOTES: ${{ matrix.release_notes }}
        run: |
          gh release delete ${{ matrix.release_tag }} --yes --cleanup-tag || true
          gh release create ${{ matrix.release_tag }} \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest=${{ matrix.device == 'standard' }} \
            output/${{ matrix.iso_name }}.7z.*

      - name: Remove older releases of this edition
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Installs update through SlozOS's update images, so only the newest
          # ISO per edition is kept. Runs only after the new release uploaded.
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E -- '-(${{ matrix.device }}|sp1|sp2|sb1)$' \
            | grep -vx -- '${{ matrix.release_tag }}' \
            | while read -r tag; do
                echo "Deleting old release $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done

      # ── VM test: boot the same image in QEMU/KVM, log in, screenshot ────────
      # Skipped when the ISO was reused — the PR run already tested it.
      - name: Make room for the VM disk
        if: steps.reuse.outputs.reused != 'true'
        run: rm -rf output && df -h /

      - name: Enable KVM + install QEMU
        if: steps.reuse.outputs.reused != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Make VM disk image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p vmdisk
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/tests/vm/bib-config.toml:/config.toml:ro" \
            -v "$(pwd)/vmdisk:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs btrfs --config /config.toml \
            localhost/${{ matrix.image_tag }}:latest
          sudo chown -R "$USER:$USER" vmdisk

      - name: Boot in QEMU, log in, take screenshots
        if: steps.reuse.outputs.reused != 'true'
        # Reported as a warning rather than blocking: the screenshots are the
        # real output, and a flaky VM shouldn't hold up a working ISO.
        continue-on-error: true
        run: python3 tests/vm/qemu-test.py --disk vmdisk/qcow2/disk.qcow2 --out vm-results

      - name: Check the VM updates from SlozOS
        if: steps.reuse.outputs.reused != 'true'
        run: |
          if [ ! -f vm-results/update-source.txt ]; then
            echo "::warning::VM test didn't get far enough to check the update source"; exit 0
          fi
          SRC=$(cat vm-results/update-source.txt)
          echo "Installed system updates from: $SRC"
          case "$SRC" in
            *"$IMAGE":*) echo "OK" ;;
            *) echo "::error::Fresh install would update from '$SRC', not $IMAGE"; exit 1 ;;
          esac

      - name: Upload VM screenshots + serial log
        if: always() && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-${{ matrix.device }}
          path: vm-results/
          retention-days: 14
