name: Build SlozOS

# One build per edition per change:
#   • Pull request → build the image once, make the ISO *and* a VM disk from it,
#     boot the VM, screenshot it, keep the ISO as an artifact. Never publishes.
#   • Merge to main → no rebuild: if the merged code is exactly what the PR
#     tested, publish the ISOs that PR run already built. Otherwise (main moved
#     on, direct push, artifact expired) build as usual and publish.
#   • Run workflow (manual) → full build + publish.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      # Test-only changes don't change the OS, so don't republish releases
      - 'tests/**'
      - '.github/workflows/interactive-vm.yml'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

# A new push to a PR cancels that PR's still-running build; main never cancels.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Stable check name — branch protection requires it.
    name: Build ${{ matrix.display_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write     # push the OS update images to ghcr.io
    strategy:
      fail-fast: false          # keep building the others if one fails
      matrix:
        include:
          - device: sp2
            display_name: Surface Pro 2
            containerfile: build/Containerfile.sp2
            image_tag: slozos-sp2
            iso_name: SlozOS-1.2.1-SP2-amd64
            artifact: SlozOS-SP2-ISO
            release_tag: v1.2.1-sp2
            release_title: "SlozOS 1.2.1 — Surface Pro 2 · Full Release"
            release_notes: |
              🎉 **SlozOS 1.2.1 is the full release of SlozOS** for the **Microsoft Surface Pro 2** (2013, Haswell).

              **New in 1.2.1:** Fixes System Update (new installs now really switch to SlozOS updates), one **SlozOS Updater** with SlozOS branding and release notes, instead of two.

              **New in 1.2:** SlozOS now updates from its own images — 1.2 → 1.3 → 2.0, never to plain Bazzite. New SlozOS Updater, SlozOS Portal and SlozOS Help replace Bazzite's; a crisp new sloth icon in the menu bar; the boot menu and terminal say SlozOS.

              **Coming from 1.1.x or 1.2?** Run this once in a terminal, then reboot, to switch to SlozOS updates: `sudo bootc switch ghcr.io/jackachuyt/slozos-sp2:stable`

              **Also included:** SlozOS Spotlight (Meta+Space), the Apps grid, the SlozOS logo menu, and the macOS Tahoe Liquid Glass desktop.

              **Hardware support:**
              - ✅ Keyboard / Type Cover
              - ✅ Touchscreen & Pen
              - ✅ WiFi (Marvell 88W8797 USB)
              - ✅ Bluetooth
              - ✅ Cameras (front + rear, uvcvideo)
              - ✅ Audio
              - ✅ Suspend / Hibernate
              - ✅ Sensors & Battery
              - ❌ Performance Modes (not supported)

              The ISO (~5.5 GB) is split into 1900 MB parts. Download all parts into one folder, then reassemble:
              ```
              7z x SlozOS-1.2.1-SP2-amd64.7z.001
              ```
              Flash `SlozOS-1.2.1-SP2-amd64.iso` with Balena Etcher. Boot the Surface with **Volume Down + Power**.

          - device: sp1
            display_name: Surface Pro 1
            containerfile: build/Containerfile.sp1
            image_tag: slozos-sp1
            iso_name: SlozOS-1.2.1-SP1-amd64
            artifact: SlozOS-SP1-ISO
            release_tag: v1.2.1-sp1
            release_title: "SlozOS 1.2.1 — Surface Pro 1 · Full Release"
            release_notes: |
              🎉 **SlozOS 1.2.1 is the full release of SlozOS** for the **Microsoft Surface Pro 1** (2013, Ivy Bridge).

              **New in 1.2.1:** Fixes System Update (new installs now really switch to SlozOS updates), one **SlozOS Updater** with SlozOS branding and release notes, instead of two.

              **New in 1.2:** SlozOS now updates from its own images — 1.2 → 1.3 → 2.0, never to plain Bazzite. New SlozOS Updater, SlozOS Portal and SlozOS Help replace Bazzite's; a crisp new sloth icon in the menu bar; the boot menu and terminal say SlozOS.

              **Coming from 1.1.x or 1.2?** Run this once in a terminal, then reboot, to switch to SlozOS updates: `sudo bootc switch ghcr.io/jackachuyt/slozos-sp1:stable`

              **Also included:** SlozOS Spotlight (Meta+Space), the Apps grid, the SlozOS logo menu, and the macOS Tahoe Liquid Glass desktop.

              **Hardware support:**
              - ✅ Keyboard / Type Cover
              - ✅ Touchscreen & Pen
              - ✅ WiFi (Marvell USB)
              - ✅ Bluetooth
              - ✅ Both Cameras
              - ✅ Audio
              - ✅ Suspend / Hibernate
              - ✅ Sensors & Battery
              - ❌ Performance Modes (not supported)

              The ISO (~5.5 GB) is split into 1900 MB parts. Download all parts into one folder, then reassemble:
              ```
              7z x SlozOS-1.2.1-SP1-amd64.7z.001
              ```
              Flash `SlozOS-1.2.1-SP1-amd64.iso` with Balena Etcher. Boot the Surface with **Volume Down + Power**.

          - device: sb1
            display_name: Surface Book 1
            containerfile: build/Containerfile.sb1
            image_tag: slozos-sb1
            iso_name: SlozOS-1.2.1-SB1-amd64
            artifact: SlozOS-SB1-ISO
            release_tag: v1.2.1-sb1
            release_title: "SlozOS 1.2.1 — Surface Book 1 · Full Release"
            release_notes: |
              🎉 **SlozOS 1.2.1 is the full release of SlozOS** for the **Microsoft Surface Book 1** (2015, Skylake + NVIDIA GTX 940M).

              **New in 1.2.1:** Fixes System Update (new installs now really switch to SlozOS updates), one **SlozOS Updater** with SlozOS branding and release notes, instead of two.

              **New in 1.2:** SlozOS now updates from its own images — 1.2 → 1.3 → 2.0, never to plain Bazzite. New SlozOS Updater, SlozOS Portal and SlozOS Help replace Bazzite's; a crisp new sloth icon in the menu bar; the boot menu and terminal say SlozOS.

              **Coming from 1.1.x or 1.2?** Run this once in a terminal, then reboot, to switch to SlozOS updates: `sudo bootc switch ghcr.io/jackachuyt/slozos-sb1:stable`

              **Also included:** SlozOS Spotlight (Meta+Space), the Apps grid, the SlozOS logo menu, and the macOS Tahoe Liquid Glass desktop.

              **Hardware support:**
              - ✅ Keyboard & Touchpad
              - ✅ Touchscreen & Pen
              - ✅ WiFi (Marvell 88W8897 PCIe)
              - ✅ Bluetooth
              - ✅ Dedicated GPU (GTX 940M via PRIME)
              - ✅ Clipboard Detachment
              - ✅ Audio, Sensors, Battery
              - ✅ Suspend / Hibernate
              - ❌ Performance Modes (not supported)
              - ❓ Cameras (status unclear)

              The ISO (~5.5 GB) is split into 1900 MB parts. Download all parts into one folder, then reassemble:
              ```
              7z x SlozOS-1.2.1-SB1-amd64.7z.001
              ```
              Flash `SlozOS-1.2.1-SB1-amd64.iso` with Balena Etcher. Boot with **Volume Down + Power**.

    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      SLOZOS_VERSION: "1.2.1"
      # Installed systems update from here (see config/slozos/slozos-update-origin)
      IMAGE: ghcr.io/jackachuyt/${{ matrix.image_tag }}
      # The commit this build is of: the PR head for PRs, the pushed commit otherwise
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reuse the ISO the pull request already built
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          PR_HEAD=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // empty')
          if [ -z "$PR_HEAD" ]; then echo "Not from a pull request — building."; exit 0; fi
          # Only reuse if the merged code is byte-for-byte what the PR tested
          OUR_TREE=$(git rev-parse 'HEAD^{tree}')
          PR_TREE=$(gh api "repos/$REPO/git/commits/$PR_HEAD" --jq .tree.sha)
          if [ "$OUR_TREE" != "$PR_TREE" ]; then echo "Merged code differs from what the PR tested — building."; exit 0; fi
          RUN=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$PR_HEAD&event=pull_request" \
                  --jq '[.workflow_runs[] | select(.status == "completed")][0].id // empty')
          if [ -z "$RUN" ]; then echo "No finished PR build found — building."; exit 0; fi
          mkdir -p output
          if gh run download "$RUN" -n "${{ matrix.artifact }}" -D output; then
            echo "Reusing ${{ matrix.artifact }} from PR build $RUN"
            ls -lh output
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "pr_head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "PR build $RUN has no ${{ matrix.artifact }} (failed or expired) — building."
            rm -rf output
          fi

      - name: Free up disk space
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Build SlozOS ${{ matrix.display_name }} image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo podman build \
            -t localhost/${{ matrix.image_tag }}:latest \
            -f ${{ matrix.containerfile }} .

      - name: Push update image (tagged with this commit)
        if: steps.reuse.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push localhost/${{ matrix.image_tag }}:latest "docker://$IMAGE:sha-$HEAD_SHA"

      - name: Generate bootable ISO
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs btrfs \
            localhost/${{ matrix.image_tag }}:latest
          ISO=$(sudo find output -name '*.iso' | head -1)
          sudo mv "$ISO" output/${{ matrix.iso_name }}.iso
          sudo chown -R "$USER:$USER" output
          ls -lh output/

      - name: Upload ISO artifact
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: output/${{ matrix.iso_name }}.iso
          retention-days: 7
          compression-level: 0

      - name: Split ISO into <2GB volumes
        if: env.PUBLISH == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y p7zip-full
          cd output && 7z a -mx=0 -v1900m ${{ matrix.iso_name }}.7z ${{ matrix.iso_name }}.iso
          ls -lh ${{ matrix.iso_name }}.7z.*

      - name: Publish update image (stable + version tags)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_SHA: ${{ steps.reuse.outputs.pr_head || env.HEAD_SHA }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y skopeo; }
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Same registry, same blobs: these are just new tags on the tested image
          for tag in stable "$SLOZOS_VERSION"; do
            skopeo copy --all "docker://$IMAGE:sha-$SRC_SHA" "docker://$IMAGE:$tag"
          done

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through env, not inlined: inlining put the notes inside a
          # double-quoted shell string, so their ``` fences ran as command
          # substitutions (the published notes contained 7-Zip's console output).
          RELEASE_TITLE: ${{ matrix.release_title }}
          RELEASE_NOTES: ${{ matrix.release_notes }}
        run: |
          gh release delete ${{ matrix.release_tag }} --yes --cleanup-tag || true
          gh release create ${{ matrix.release_tag }} \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest=${{ matrix.device == 'sp2' }} \
            output/${{ matrix.iso_name }}.7z.*

      - name: Remove older releases of this edition
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Installs update through SlozOS's update images, so only the newest
          # ISO per edition is kept. Runs only after the new release uploaded.
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E -- '-${{ matrix.device }}$' \
            | grep -vx -- '${{ matrix.release_tag }}' \
            | while read -r tag; do
                echo "Deleting old release $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done

      # ── VM test: boot the same image in QEMU/KVM, log in, screenshot ────────
      # Skipped when the ISO was reused — the PR run already tested it.
      - name: Make room for the VM disk
        if: steps.reuse.outputs.reused != 'true'
        run: rm -rf output && df -h /

      - name: Enable KVM + install QEMU
        if: steps.reuse.outputs.reused != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Make VM disk image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p vmdisk
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/tests/vm/bib-config.toml:/config.toml:ro" \
            -v "$(pwd)/vmdisk:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs btrfs --config /config.toml \
            localhost/${{ matrix.image_tag }}:latest
          sudo chown -R "$USER:$USER" vmdisk

      - name: Boot in QEMU, log in, take screenshots
        if: steps.reuse.outputs.reused != 'true'
        # Reported as a warning rather than blocking: the screenshots are the
        # real output, and a flaky VM shouldn't hold up a working ISO.
        continue-on-error: true
        run: python3 tests/vm/qemu-test.py --disk vmdisk/qcow2/disk.qcow2 --out vm-results

      - name: Check the VM updates from SlozOS
        if: steps.reuse.outputs.reused != 'true'
        run: |
          if [ ! -f vm-results/update-source.txt ]; then
            echo "::warning::VM test didn't get far enough to check the update source"; exit 0
          fi
          SRC=$(cat vm-results/update-source.txt)
          echo "Installed system updates from: $SRC"
          case "$SRC" in
            *"$IMAGE":*) echo "OK" ;;
            *) echo "::error::Fresh install would update from '$SRC', not $IMAGE"; exit 1 ;;
          esac

      - name: Upload VM screenshots + serial log
        if: always() && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-${{ matrix.device }}
          path: vm-results/
          retention-days: 14
